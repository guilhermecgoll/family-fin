[project]
name = "financas"
version = "0.1.0"
description = "Finanças da família: lançamentos pelo Telegram, fluxo de caixa e lista de compras."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.36",
    "tzdata>=2024.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/financas"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = ["integration: testes contra Postgres real em container"]

[tool.coverage.run]
source = ["financas"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ['if __name__ == "__main__":']
skip_covered = true
