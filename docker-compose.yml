x-banco: &banco
  image: postgres:16-alpine
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 2s
    timeout: 3s
    retries: 15

services:
  db:
    <<: *banco
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financas}
      POSTGRES_USER: ${POSTGRES_USER:-financas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?rode scripts/criar-env.sh para gerar o .env}
    volumes:
      - db-data:/var/lib/postgresql/data

  # --- Desenvolvimento (profile "dev"): só sobe quando chamado explicitamente ---

  # Banco descartável dos testes de integração, em memória.
  db-test:
    <<: *banco
    profiles: [dev]
    environment:
      POSTGRES_DB: teste
      POSTGRES_USER: teste
      POSTGRES_PASSWORD: teste
    tmpfs:
      - /var/lib/postgresql/data

  # Ferramentas: testes, lint, formatação, migrações, uv lock.
  # Uso: docker compose run --rm dev <comando>
  dev:
    profiles: [dev]
    build:
      context: .
      target: dev
      args:
        UID: ${DEV_UID:-1000}
        GID: ${DEV_GID:-1000}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-financas}:${POSTGRES_PASSWORD:-}@db:5432/${POSTGRES_DB:-financas}
      TEST_DATABASE_URL: postgresql+psycopg://teste:teste@db-test:5432/teste
    volumes:
      - .:/app
      - venv:/opt/venv
      - uv-cache:/home/dev/.cache/uv
    depends_on:
      db-test:
        condition: service_healthy

volumes:
  db-data:
  venv:
  uv-cache:
